<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bike App Login</title>

  <!-- Connect CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="main-container">

    <div class="left-section">
      <div class="branding">
        <h1>🚲 BIKE APP</h1>
        <p>Ride More, Worry Less</p>
      </div>
    </div>

    <div class="login-card">

      <div class="icon-circle">🚴</div>

      <h2>Welcome Back!</h2>

      <p class="subtitle">
        Login to continue your journey
      </p>

      <input
        type="text"
        id="email"
        placeholder="Email"
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
      >

      <button onclick="login()">
        🚲 Login
      </button>

      <p id="result"></p>

      <div class="divider">or</div>

      <p class="signup-text">
        Don’t have an account?
        <a href="#">Sign up</a>
      </p>

    </div>

  </div>

  <div class="bottom-bar">

    <div class="feature-box">
      <h3>🚴 Track Rides</h3>
      <p>Monitor your cycling activities</p>
    </div>

    <div class="feature-box">
      <h3>🗺 Explore Routes</h3>
      <p>Discover scenic cycling routes</p>
    </div>

    <div class="feature-box">
      <h3>👥 Community</h3>
      <p>Meet fellow cyclists</p>
    </div>

    <div class="feature-box">
      <h3>🛡 Stay Safe</h3>
      <p>Safety support and guidance</p>
    </div>

  </div>

  <!-- Connect JavaScript -->
  <script src="script.js"></script>

</body>
</html>
